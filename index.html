    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers; without it a notch and a home indicator both read 0 and the
         board's toolbar sits under the indicator. No maximum-scale and no
         user-scalable=no: both break pinch-zoom for anyone who needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gauge</title>
  </head>
